# Cutting a release, and saying exactly what it is.
#
# WHY THIS EXISTS. scripts/package-horizon.sh already produces the thing
# a release should contain — the .nro, the licence they are distributed
# under, and a manifest that ties every artefact to one build id and one
# toolchain — and it was only ever run by hand. Nothing published it.
#
# WHY THE STEPS ARE NOT INSIDE THE TOOLCHAIN IMAGE. They drive it from
# outside. Running them inside would set $DEVKITPRO, which puts
# scripts/toolchain-env.sh into local mode, and then package-horizon.sh
# writes `image: local` — losing the digest of the image that actually
# produced the binaries, against a mutable `:latest` tag. That is the
# manifest's whole job, and it was the finding of a review on PR #10.
#
# WHAT THIS PRODUCES, AND WHAT IT DOES NOT. A cross build. The artefacts
# have compiled and nothing more: no console has run them. This project
# keeps host / cross / hardware-verified apart everywhere else, and a
# release is not where that stops — so the notes say it in the release
# body rather than leaving a reader to assume.
#
# NAMING THE GAP, the way gates.yml does. This publishes the eighteen
# .nro of the Makefile path. The twelve t_vk_* and the NVK driver are
# built by the `archives` job in gates.yml, which takes far longer;
# publishing those is docs/RELEASING.md's manual path, with a hardware
# run behind it.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: the runner can drive docker
        run: |
          set -eu
          command -v docker >/dev/null || {
              echo "error: no docker CLI on this runner." >&2
              exit 1
          }
          docker info >/dev/null

      - name: build
        run: scripts/build-switch.sh -j"$(nproc)"

      - name: package
        run: |
          set -eu
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

      # The digest has to be in there. If it is not, the packaging step
      # ran in a mode that cannot attribute these binaries to a
      # toolchain, and publishing them would put an unattributable
      # artefact in front of people.
      - name: the manifest identifies the toolchain
        run: |
          set -eu
          grep -qE '^image +: .*@sha256:' build/pkg/MANIFEST.txt || {
              echo "error: no image digest in MANIFEST.txt:" >&2
              grep '^image' build/pkg/MANIFEST.txt >&2 || true
              echo "       Refusing to publish artefacts whose toolchain" >&2
              echo "       cannot be identified." >&2
              exit 1
          }

      - name: assemble the assets and the notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          tar -czf "mesa-nvk-horizon-${tag}-nro.tar.gz" -C build/pkg .
          sha256sum "mesa-nvk-horizon-${tag}-nro.tar.gz" \
              > "mesa-nvk-horizon-${tag}-nro.tar.gz.sha256"

          build_id=$(sed -n 's/^build id  *: //p' build/pkg/MANIFEST.txt)
          count=$(find build/pkg -name '*.nro' | wc -l)

          {
            echo "## What is in this release"
            echo
            echo "The \`horizon_gpu\` test programs as standalone \`.nro\`"
            echo "homebrew, the licence they are distributed under, and the"
            echo "manifest tying every one of them to a single build and"
            echo "toolchain."
            echo
            echo "- **${count} \`.nro\`**"
            echo "- **Build id:** \`${build_id}\`"
            echo
            echo "Every test prints that build id as the second line of its"
            echo "log. If a log you are reporting does not carry this exact"
            echo "stamp, it came from other binaries."
            echo
            echo "## What this release does not claim"
            echo
            echo "**These artefacts are cross-built. No console has run"
            echo "them.** This project keeps *host build*, *cross build* and"
            echo "*verified on real hardware* strictly apart, and a release"
            echo "does not blur them: a \`.nro\` that compiles is not a"
            echo "\`.nro\` that works. What has run on hardware, and what has"
            echo "not, is in \`STATUS.md\` — read its *Current state* block"
            echo "before assuming."
            echo
            echo "**The Vulkan half is not here.** The twelve \`t_vk_*\`"
            echo "tests and the NVK driver need the derived toolchain image"
            echo "and a full Mesa build. See \`docs/RELEASING.md\`."
            echo
            echo "## Running these"
            echo
            echo "Copy the \`.nro\` to \`sdmc:/switch/horizon_gpu_tests/\` and"
            echo "launch from hbmenu. Each prints \`RESULT: PASS (n/n)\` on"
            echo "screen and to \`sdmc:/horizon_gpu_tests/<name>.log\`. Full"
            echo "instructions: \`docs/USAGE.md\`."
            echo
            echo "This is pre-1.0 software driving a GPU through system"
            echo "services. It has taken a console down before. Run it when"
            echo "you are willing to reboot."
            echo
            echo "## Verifying what you downloaded"
            echo
            echo '```sh'
            echo "sha256sum -c mesa-nvk-horizon-${tag}-nro.tar.gz.sha256"
            echo '```'
            echo
            echo "\`MANIFEST.txt\` inside the archive carries a sha256 for"
            echo "each \`.nro\`, the resolved toolchain image digest, and the"
            echo "devkitA64 and libnx package versions the build used."
          } > NOTES.md

      - name: publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          scripts/ci-forgejo-release.sh "$tag" NOTES.md \
              "mesa-nvk-horizon-${tag}-nro.tar.gz" \
              "mesa-nvk-horizon-${tag}-nro.tar.gz.sha256"

# Everything CI does on a push, and it happens INSIDE the toolchain
# image.
#
# WHY INSIDE, and it is not a preference. The jobs used to drive the
# image from outside, so that scripts/package-horizon.sh could read a
# registry digest. That cannot work here: act_runner puts the job in a
# container, `docker run -v "$PWD":"$PWD"` is then resolved by the
# *host* daemon against a path that only exists in the job, and the
# mount comes up empty. Measured on task 1274 — bindgen reported
# `No such file or directory` about a header sitting right beside it,
# and every horizon_run in the build would have done the same.
#
# Inside the image there is no nested docker and no mount at all:
# $DEVKITPRO is set, scripts/toolchain-env.sh takes the local path, and
# cargo, bindgen, cbindgen, LLVM and the Rust sysroot are already there.
# Attribution survives because the image records its own build identity
# in /etc/mesa-nvk-horizon-toolchain, which the packaging step reads.
#
# THE IMAGE HAS TO EXIST FIRST. toolchain-image.yml builds and publishes
# it. Override the reference with the TOOLCHAIN_IMAGE repository
# variable if this repository moves.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: archives

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: archives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archives:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TOOLCHAIN_IMAGE || 'git.not-d3fau4.com:3000/d3fau4/nx-dev-mesa:latest' }}
      env:
        DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- seconds, and they run first for that reason ---------------
      - name: history and hardware logs match their manifests
        run: ./scripts/check-history-intact.sh

      - name: the two build systems agree
        run: ./scripts/check-mesa-test-parity.sh

      - name: layer rules
        run: ./scripts/check-layering.sh

      - name: no absolute paths in tracked files
        run: ./scripts/check-no-abs-paths.sh

      - name: host tests
        run: ./scripts/run-host-tests.sh

      # --- and then the long one -------------------------------------
      #
      # The build id carries HEAD, and git refuses a repository owned by
      # another uid. Without this the stamp degrades to "nogit" and the
      # artefacts lose the field that attributes them to a commit.
      - name: let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every .a the tests link, then the .nro that prove the archives
      # are usable rather than merely present, then the two gates that
      # need built artefacts. Ordering and retries are in the script.
      - name: every archive the tests link
        run: scripts/ci-build-archives.sh

      - name: package
        run: |
          set -eu
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

      - name: Upload dist
        uses: forgejo/upload-artifact@v4
        with:
          name: horizon-gpu-tests-full
          path: build/pkg
          if-no-files-found: error

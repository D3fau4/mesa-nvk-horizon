# The gates, run by something other than somebody's memory.
#
# WHY THIS EXISTS. Every check in this repository was a script a person
# had to remember to invoke, and scripts/split-status.py's own
# documentation promised that an undeclared edit to the record "shows up
# as a failing gate" while nothing made it fail. A review of PR #7
# caught the promise being empty. This makes it true.
#
# WHY THE JOBS ARE SPLIT THREE WAYS. They cost wildly different amounts
# and fail for different reasons, and a thirty-minute job in front of a
# five-second one means nobody sees the five-second answer:
#
#   gates     bash, python and a C compiler. Seconds.
#   cross     the toolchain image and the Makefile path. About a minute.
#   archives  Mesa, Rust, LLVM and NVK — every .a the tests link.
#
# WHAT THE RUNNER NEEDS. `archives` and `cross` do NOT run inside a
# container: the scripts drive containers themselves, and one of them
# runs `docker build`. So the runner needs the docker CLI and a usable
# /var/run/docker.sock. Running these steps *inside* the toolchain image
# instead would also lose the image digest from the packaging manifest,
# which is the field that attributes an artefact to a toolchain.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: gates

on:
  push:
  pull_request:
  # Runnable by hand from the web UI. Worth having for the `archives`
  # job in particular: it is the long one, it depends on material
  # fetched from four external services, and "did that break, or was it
  # the network" is a question best answered by pressing a button rather
  # than by pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The record is evidence. An edit nobody declared is what this is
      # for, and it costs a second.
      - name: history and hardware logs match their manifests
        run: ./scripts/check-history-intact.sh

      # Two build systems describing the same tests. This is the one
      # that had already diverged, found by a reviewer instead.
      - name: the two build systems agree
        run: ./scripts/check-mesa-test-parity.sh

      # horizon/ must not reach for Vulkan, Mesa or nwindow.
      - name: layer rules
        run: ./scripts/check-layering.sh

      - name: no absolute paths in tracked files
        run: ./scripts/check-no-abs-paths.sh

      # horizon_gpu's pure logic, compiled and run natively. No
      # toolchain, no device.
      - name: host tests
        run: ./scripts/run-host-tests.sh

  # The fast half of the cross build: libhorizon_gpu.a, libhorizon_compat.a
  # and the eighteen .nro that need nothing but the toolchain image. It
  # is the Makefile path — the one whose output was verified on hardware
  # — and it is what the release workflow runs, so a tag can never be
  # the first time it is tried.
  cross:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: the runner can drive docker
        run: scripts/ci-require-docker.sh

      - name: the .nro build
        run: scripts/build-switch.sh -j"$(nproc)"

      # Not the build's own claim: count what is on disk. A build that
      # silently produced fewer artefacts is the failure this catches.
      - name: 18 .nro, and the packaging step agrees
        run: |
          set -eu
          n=$(find build -maxdepth 1 -name '*.nro' | wc -l)
          echo "built $n .nro"
          [ "$n" -eq 18 ] || {
              echo "expected 18 .nro from the Makefile path without Mesa" >&2
              exit 1
          }
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

  # Every remaining .a: the two Mesa core archives and the seventeen the
  # Vulkan tests link. This is the job that makes a broken patch in
  # mesa-patches/ fail here instead of on somebody's machine a week
  # later. It ends by rebuilding the .nro and asserting there are 32 of
  # them, because archives existing and the build being able to use them
  # are two different claims.
  #
  # Everything it does lives in scripts/ci-build-archives.sh, which can
  # be run by hand and is where the ordering and the retries are
  # explained.
  archives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: the runner can drive docker
        run: scripts/ci-require-docker.sh

      - name: every archive the tests link
        run: scripts/ci-build-archives.sh

      - name: package
        run: scripts/package-horizon.sh build/pkg

      - name: Upload dist
        uses: forgejo/upload-artifact@v4
        with:
          name: horizon-gpu-tests-full
          path: build/pkg

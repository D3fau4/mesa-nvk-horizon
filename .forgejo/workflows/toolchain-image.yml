# Builds the derived toolchain image once, and publishes it, so that CI
# does not build it again.
#
# WHY. The derived image is the base nx-dev plus libclang, bindgen,
# cbindgen, a Rust sysroot for the Switch target and an LLVM-15 libclc
# closure — everything Mesa's Rust half and NVK need and devkitPro does
# not ship. Building it takes about eleven minutes and 7.3 GB. A runner
# that keeps its docker daemon pays that once, but a new or cleaned
# runner pays it again, and nothing else can.
#
# WHAT PUBLISHING BUYS. archives.yml pulls this instead, and
# scripts/build-toolchain-image.sh recognises it as current by its
# identity label — the base image ID, the pinned bindgen/cbindgen/LLVM
# versions, the resolved .deb closure and the Dockerfile's own digest.
# If any of those move, the pulled image is NOT current and the build
# happens anyway. Publishing is a cache, never an authority.
#
# WHERE. Computed from the instance this runs on rather than written
# down: $GITHUB_SERVER_URL gives the host, $GITHUB_REPOSITORY the owner.
# Hard-coding a hostname would break the moment the repository moved.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: toolchain image

on:
  push:
    paths:
      - 'toolchain/Dockerfile'
      - 'toolchain/versions.env'
      - 'scripts/build-toolchain-image.sh'
      - '.forgejo/workflows/toolchain-image.yml'
  workflow_dispatch:

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: the runner can drive docker
        run: scripts/ci-require-docker.sh

      - name: rust, only if this runner has none
        run: |
          set -eu
          command -v cargo >/dev/null && exit 0
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: what this machine has to provide
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/ci-require-host-tools.sh

      - name: where the image lives
        run: |
          set -eu
          registry="${GITHUB_SERVER_URL#*://}"
          owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" \
                      | tr '[:upper:]' '[:lower:]')
          echo "HORIZON_REGISTRY=$registry" >> "$GITHUB_ENV"
          echo "HORIZON_NX_DERIVED_IMAGE=$registry/$owner/nx-dev-mesa:latest" \
              >> "$GITHUB_ENV"

      # Pulled first so an unchanged image is recognised and this job
      # ends in seconds. The identity check inside the build script is
      # what decides; this only makes the candidate available to it.
      - name: pull what is published, if anything
        run: |
          set -eu
          docker pull "$HORIZON_NX_DERIVED_IMAGE" \
              || echo "nothing published yet — building from scratch"

      - name: build it if it is not current
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-toolchain-image.sh

      # FORGEJO_TOKEN if it is set, otherwise the run's automatic token.
      # A Forgejo instance may or may not grant package:write to the
      # latter; if the push is refused, set FORGEJO_TOKEN as a repository
      # secret from a token that has it.
      - name: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$REGISTRY_TOKEN" \
              | docker login "$HORIZON_REGISTRY" \
                  -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$HORIZON_NX_DERIVED_IMAGE"
          echo "published $HORIZON_NX_DERIVED_IMAGE"
          docker logout "$HORIZON_REGISTRY" || true

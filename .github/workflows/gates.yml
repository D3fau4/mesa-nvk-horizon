# The gates, run by something other than somebody's memory.
#
# WHY THIS EXISTS. Every check in this repository was a script a person
# had to remember to invoke, and scripts/split-status.py's own
# documentation promised that an undeclared edit to the record "shows up
# as a failing gate" while nothing made it fail. A review of PR #7
# caught the promise being empty. This makes it true for the checks that
# need nothing but bash, python and a C compiler.
#
# WHAT IS NOT HERE, and why. check-dispatch-complete.sh reads the
# generated Vulkan dispatch table out of a linked Horizon ELF, and
# check-tls-relocs.sh scans devkitA64 objects; both need the
# cross-toolchain image, which is a container pull and several minutes
# per run. Those stay manual until somebody decides that cost is worth
# paying — naming the gap rather than pretending the coverage is
# complete.
#
# Delete this file if the minutes are not wanted. Nothing depends on it.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: gates

on:
  push:
    branches: ['**']
  pull_request:

# Nothing here writes anything.
permissions:
  contents: read

# Superseded pushes to the same branch are not worth minutes.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The record is evidence. An edit nobody declared is what this is
      # for, and it costs a second.
      - name: history and hardware logs match their manifests
        run: ./scripts/check-history-intact.sh

      # Two build systems describing the same tests. This is the one
      # that had already diverged, found by a reviewer instead.
      - name: the two build systems agree
        run: ./scripts/check-mesa-test-parity.sh

      # horizon/ must not reach for Vulkan, Mesa or nwindow.
      - name: layer rules
        run: ./scripts/check-layering.sh

      - name: no absolute paths in tracked files
        run: ./scripts/check-no-abs-paths.sh

      # horizon_gpu's pure logic, compiled and run natively. No
      # toolchain, no device.
      - name: host tests
        run: ./scripts/run-host-tests.sh

  # The gates above never compiled anything for the console, so a change
  # that broke the cross build left all five green — which is how the
  # release path could fail for the first time on a tag, on work already
  # merged. This is a pull of the toolchain image and about a minute of
  # compiling.
  #
  # It is deliberately the *Makefile* path: it needs nothing but the
  # image, it is the path whose output was verified on hardware, and it
  # is what .github/workflows/release.yml runs. The Meson path needs
  # pinned Meson installed over the network, and the twelve t_vk_* tests
  # need the whole Mesa and Rust chain — both still uncovered here, and
  # said out loud rather than left to look complete.
  cross:
    name: cross build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/d3fau4/nx-dev:latest
      env:
        DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4

      # gen-build-id.sh reads HEAD, and git refuses a repository owned
      # by another uid — which is what a checkout mounted into a
      # container is. Without this the stamp silently becomes "nogit".
      - name: let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: the .nro build
        run: make all -j"$(nproc)"

      # Not the build's own claim: count what is on disk. A build that
      # silently produced fewer artefacts is the failure this catches.
      - name: 18 .nro, and the packaging step agrees
        run: |
          set -eu
          n=$(find build -maxdepth 1 -name '*.nro' | wc -l)
          echo "built $n .nro"
          [ "$n" -eq 18 ] || {
              echo "expected 18 .nro from the Makefile path without Mesa" >&2
              exit 1
          }
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

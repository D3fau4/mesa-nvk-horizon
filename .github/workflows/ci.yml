# Everything CI does on a push: make sure the derived toolchain image is
# current in ghcr.io, then build the whole tree inside it.
#
# This is the GitHub port of .forgejo/workflows-disabled/archives.yml.
# Same two jobs, same reason for the split — but the mechanism connecting
# them is different, because it has to be: GitHub-hosted runners are one
# throwaway VM per job, so there is no shared docker daemon for `toolchain`
# to leave an image in and `archives` to find it in the way the Forgejo
# original did on its own persistent runner.
#
# WHAT REPLACES THE SHARED DAEMON. ghcr.io. The Forgejo original never
# published this image because that instance speaks plain HTTP and docker
# refuses a non-HTTPS registry (STATUS.md, "CI switched off", tasks 1275
# and 1276) — a constraint specific to that instance, not to the idea of a
# registry. ghcr.io is HTTPS, so `toolchain` pushes the image there and
# `archives` pulls it back through the job `container:`, which is exactly
# what `container:` is for. scripts/build-toolchain-image.sh did not need
# to change for this: it already resolves the image to build or reuse
# through $HORIZON_NX_DERIVED_IMAGE (docs/BUILDING.md, "Point somewhere
# else with the TOOLCHAIN_IMAGE repository variable"), and its own
# identity check — base image ID, pinned bindgen/cbindgen/LLVM versions,
# the resolved .deb closure, the Dockerfile's digest — does the right
# thing against a pulled image with no further help. Seconds when the
# pulled image already matches; ~11 minutes only when toolchain/Dockerfile
# or a pin in toolchain/versions.env actually moved.
#
# WHY THE FULL BUILD RUNS ON EVERY PUSH, PR AND DISPATCH, UNIFORMLY. The
# whole point of scripts/ci-build-archives.sh is catching a broken patch
# in mesa-patches/ before it lands — the one thing five cheap gates cannot
# see. A PR-only "gates" job would skip exactly the check that matters
# most on a PR. This is affordable here because the repository is public
# (no metered Actions minutes) and because the GHCR cache above turns the
# expensive part of "compile Mesa entero" into a one-time cost per pin
# change rather than a per-run one.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: archives-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Not inside a container: this one produces the image the other job
  # runs in.
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A ghcr.io repository name has to be all-lowercase, and GitHub
      # Actions expressions have no lower() function to enforce that on
      # ${{ github.repository_owner }} inline — measured: the first run
      # of this workflow failed docker pull outright with "invalid
      # reference format: repository name (D3fau4/nx-dev-mesa) must be
      # lowercase" because the account is D3fau4, not d3fau4. Lowercasing
      # in a shell step, once, and threading the result through
      # $GITHUB_ENV (rest of this job) and $GITHUB_OUTPUT (the other job,
      # via needs.toolchain.outputs.image) is what fixes it everywhere at
      # once instead of at every place the image name is spelled out.
      - name: resolve the toolchain image name
        id: image
        run: |
          set -eu
          image="${{ vars.TOOLCHAIN_IMAGE }}"
          if [ -z "$image" ]; then
              owner_lower=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              image="ghcr.io/${owner_lower}/nx-dev-mesa:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: the runner can drive docker
        run: scripts/ci-require-docker.sh

      # ubuntu-latest ships Rust already, so this is normally a no-op.
      # Kept anyway: it is what caught task 1272 on Forgejo's runner
      # image, which had none, and a different GitHub runner image is not
      # a promise this project controls.
      - name: rust, only if this runner has none
        run: |
          set -eu
          command -v cargo >/dev/null && exit 0
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: what this machine has to provide
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/ci-require-host-tools.sh

      - name: log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Best-effort. Failing here is expected and fine: the very first
      # run ever, or the first run after a Dockerfile/pin change moved
      # the identity nothing published yet matches.
      - name: pull the cached toolchain image, if there is one
        id: pull
        run: |
          set -eu
          docker pull "$TOOLCHAIN_IMAGE" || \
              echo "ci: no cached toolchain image yet (first run, or the pins moved)"
          echo "pre_id=$(docker image inspect -f '{{.Id}}' "$TOOLCHAIN_IMAGE" 2>/dev/null || echo none)" \
              >> "$GITHUB_OUTPUT"

      # Unmodified script. HORIZON_NX_DERIVED_IMAGE is the override
      # scripts/toolchain-env.sh already reads; pointing it at the tag
      # just pulled is the entire mechanism.
      - name: the toolchain image is present and current
        id: build
        env:
          HORIZON_NX_DERIVED_IMAGE: ${{ env.TOOLCHAIN_IMAGE }}
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-toolchain-image.sh
          echo "post_id=$(docker image inspect -f '{{.Id}}' "$TOOLCHAIN_IMAGE")" \
              >> "$GITHUB_OUTPUT"

      # Push only when the image actually changed — comparing image IDs,
      # not trusting that the step ran, because "ran" and "rebuilt" are
      # not the same claim and the whole point of this cache is not
      # re-pushing 7.3 GB on a run that changed nothing.
      - name: publish the toolchain image, if it rebuilt
        if: steps.pull.outputs.pre_id != steps.build.outputs.post_id
        run: docker push "$TOOLCHAIN_IMAGE"

  archives:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- seconds, and they run first for that reason ---------------
      - name: history and hardware logs match their manifests
        run: ./scripts/check-history-intact.sh

      - name: the two build systems agree
        run: ./scripts/check-mesa-test-parity.sh

      - name: layer rules
        run: ./scripts/check-layering.sh

      - name: no absolute paths in tracked files
        run: ./scripts/check-no-abs-paths.sh

      - name: host tests
        run: ./scripts/run-host-tests.sh

      # --- and then the long one -------------------------------------
      #
      # The build id carries HEAD, and git refuses a repository owned by
      # another uid. Without this the stamp degrades to "nogit" and the
      # artefacts lose the field that attributes them to a commit.
      - name: let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every .a the tests link, then the .nro that prove the archives
      # are usable rather than merely present, then the two gates that
      # need built artefacts. Ordering and retries are in the script.
      - name: every archive the tests link
        run: scripts/ci-build-archives.sh

      - name: package
        run: |
          set -eu
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: horizon-gpu-tests-full
          path: build/pkg
          if-no-files-found: error

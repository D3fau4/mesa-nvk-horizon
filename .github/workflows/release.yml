# Cutting a release, and saying exactly what it is.
#
# WHY THIS EXISTS. scripts/package-horizon.sh already produces the thing
# a release should contain — the .nro plus a manifest that ties every
# artefact to one build id and one toolchain — and it was only ever run
# by hand. Nothing published it.
#
# WHAT THIS PRODUCES, AND WHAT IT DOES NOT. A cross build. The artefacts
# here have compiled and nothing more: no console has run them. This
# project keeps host / cross / hardware-verified apart everywhere else
# (CLAUDE.md § Process rules) and a release is not where that stops, so
# the notes below say it in the release body itself rather than leaving
# a reader to assume.
#
# NAMING THE GAP, the way .github/workflows/gates.yml does. The twelve
# t_vk_* tests and the NVK driver are NOT in this package. They need the
# derived toolchain image — libclang, bindgen, cbindgen, a Rust sysroot,
# an LLVM-15 libclc closure — plus a full Mesa build, which is tens of
# minutes and several GB and needs material fetched outside the
# container. Publishing them is docs/RELEASING.md's manual path, with a
# hardware run behind it.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; the one job that needs to write says so itself.
permissions:
  contents: read

# A tag is cut once. Two runs for the same ref would race on the same
# release, so the second waits rather than being cancelled — cancelling
# mid-upload is how a release ends up with half its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: cross build and package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/d3fau4/nx-dev:latest
      env:
        DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4

      # The build id carries the repository's HEAD, and git refuses to
      # read a repository owned by another uid — which is what a
      # checkout mounted into a container looks like. Without this,
      # gen-build-id.sh degrades to "nogit" and every artefact in the
      # release loses the one field that attributes it to a commit.
      - name: let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: build
        run: make all -j"$(nproc)"

      - name: package
        run: scripts/package-horizon.sh build/pkg

      # The manifest is the interesting half of the package; print it so
      # the run's own log records what was published.
      - name: show the manifest
        run: cat build/pkg/MANIFEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-gpu-tests
          path: build/pkg/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: horizon-gpu-tests
          path: pkg

      - name: assemble the assets
        id: assets
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          tar -czf "mesa-nvk-horizon-${tag}-nro.tar.gz" -C pkg .
          sha256sum "mesa-nvk-horizon-${tag}-nro.tar.gz" \
              > "mesa-nvk-horizon-${tag}-nro.tar.gz.sha256"
          # The build id, read out of the manifest the package step
          # wrote, which read it out of the binaries themselves.
          build_id=$(sed -n 's/^build id  *: //p' pkg/MANIFEST.txt)
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "count=$(find pkg -name '*.nro' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: write the notes
        run: |
          set -eu
          cat > NOTES.md <<'HEADER'
          ## What is in this release

          The `horizon_gpu` test programs, as standalone `.nro` homebrew, with the
          manifest that ties every one of them to a single build and toolchain.

          HEADER
          cat >> NOTES.md <<EOF
          - **${{ steps.assets.outputs.count }} \`.nro\`**
          - **Build id:** \`${{ steps.assets.outputs.build_id }}\`

          Every test prints that build id as the second line of its log. If a log you
          are reporting does not carry this exact stamp, it came from other binaries.

          EOF
          cat >> NOTES.md <<'FOOTER'
          ## What this release does not claim

          **These artefacts are cross-built. No console has run them.** This project
          keeps *host build*, *cross build* and *verified on real hardware* strictly
          apart, and a release does not blur them: a `.nro` that compiles is not a
          `.nro` that works. What *has* run on hardware, and what has not, is in
          [`STATUS.md`](STATUS.md) — read its *Current state* block before assuming.

          **The Vulkan half is not here.** The twelve `t_vk_*` tests and the NVK driver
          need the derived toolchain image and a full Mesa build, which this workflow
          does not do. Build them yourself ([`docs/BUILDING.md`](docs/BUILDING.md)) or
          wait for a manually cut release that includes them
          ([`docs/RELEASING.md`](docs/RELEASING.md)).

          ## Running these

          Copy the `.nro` to `sdmc:/switch/horizon_gpu_tests/` and launch from hbmenu.
          Each prints `RESULT: PASS (n/n)` on screen and to
          `sdmc:/horizon_gpu_tests/<name>.log`. Full instructions, environment
          variables and what to include when reporting a run:
          [`docs/USAGE.md`](docs/USAGE.md).

          This is pre-1.0 software driving a GPU through system services. It has taken
          a console down before. Run it when you are willing to reboot.

          ## Verifying what you downloaded

          ```sh
          sha256sum -c mesa-nvk-horizon-*-nro.tar.gz.sha256
          ```

          `MANIFEST.txt` inside the archive carries a sha256 for each `.nro`, the
          resolved toolchain image digest, and the devkitA64 and libnx package versions
          the build actually used.
          FOOTER

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file NOTES.md \
              --verify-tag \
              "mesa-nvk-horizon-$GITHUB_REF_NAME-nro.tar.gz" \
              "mesa-nvk-horizon-$GITHUB_REF_NAME-nro.tar.gz.sha256"

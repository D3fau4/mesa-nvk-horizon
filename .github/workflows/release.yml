# Cutting a release, and saying exactly what it is.
#
# GitHub port of .forgejo/workflows-disabled/release.yml, with two
# deliberate differences from that original.
#
# FIRST: THIS PUBLISHES THE FULL BUILD. The Forgejo version only ever
# shipped the eighteen .nro of the Makefile path, because the image it
# ran in carried no Mesa checkout — it named that gap in its own header
# rather than hide it. That constraint does not exist here: this
# workflow builds the same toolchain image and runs the full
# scripts/ci-build-archives.sh that ci.yml does, so the package this
# produces has every archive the tests link, including the fourteen
# t_vk_* Vulkan/NVK tests. Publishing less than what CI already
# validates would be the wrong kind of gap to leave unnamed.
#
# SECOND: ONE JOB, not a `toolchain` job handing an image to a
# container-based `release` job, AND the build steps run ON THE RUNNER,
# not inside `container:` or one wrapping `docker run` — see ci.yml's
# header for the full reasoning (a mutable-tag race between concurrent
# runs; a fork PR's read-only token failing an unconditional registry
# push; scripts/ci-build-archives.sh's fetch steps needing python3/pip,
# which the toolchain image deliberately does not have — measured on a
# real run before this settled on driving the toolchain through
# `horizon_run`'s own per-command `docker run` instead). A release never
# runs from a fork, so the registry-write finding does not strictly
# apply here — but the image-handoff race and the fetch-steps failure
# both would, unchanged, so this stays identical in shape to ci.yml.
# Driving the toolchain through per-command `docker run` instead of
# `container:` has a release-specific payoff on top: `gh`, preinstalled
# on the runner VM, is only reachable from a step that runs ON the
# runner. A `container:`-based job never sees it — found in review,
# before it could turn into a broken publish step that only fails at
# tag-push time.
#
# WHAT THIS PRODUCES, AND WHAT IT DOES NOT. A cross build. The artefacts
# have compiled and nothing more: no console has run them. This project
# keeps host / cross / hardware-verified apart everywhere else, and a
# release is not where that stops — so the notes say it in the release
# body rather than leaving a reader to assume.
#
# Copyright (c) mesa-nvk-horizon contributors
# SPDX-License-Identifier: MIT
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only on an actual tag push — a workflow_dispatch never publishes
      # (see the publish step's guard below) so it has nothing to check
      # against, and checking it anyway would fail every dry run from a
      # branch whose name is not v<version>. docs/RELEASING.md commits
      # this project to keeping the tag and meson.build's version field
      # in step; this is that promise enforced rather than just stated.
      - name: the tag matches the version this tree declares
        if: github.event_name == 'push'
        run: |
          set -eu
          version=$(sed -n "s/^[[:space:]]*version[[:space:]]*:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build | head -1)
          [ -n "$version" ] || {
              echo "error: could not read version : '...' out of meson.build" >&2
              exit 1
          }
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "error: tag $GITHUB_REF_NAME does not match meson.build's" \
                   "declared version ($expected)." >&2
              echo "       Either the tag is wrong, or meson.build's version" \
                   "field is stale — docs/RELEASING.md requires them to" \
                   "stay in step. Refusing to publish a release that would" \
                   "misname its own source." >&2
              exit 1
          fi

      # A ghcr.io repository name has to be all-lowercase, and GitHub
      # Actions expressions have no lower() function to enforce that on
      # ${{ github.repository_owner }} inline.
      #
      # Exported as HORIZON_NX_DERIVED_IMAGE too — the override
      # scripts/toolchain-env.sh reads — so every later step, including
      # the ones that only touch it through horizon_run's own nested
      # `docker run` calls, resolves the same image this job built or
      # pulled.
      - name: resolve the toolchain image name
        run: |
          set -eu
          image="${{ vars.TOOLCHAIN_IMAGE }}"
          if [ -z "$image" ]; then
              owner_lower=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              image="ghcr.io/${owner_lower}/nx-dev-mesa:latest"
          fi
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"
          echo "HORIZON_NX_DERIVED_IMAGE=$image" >> "$GITHUB_ENV"

      - name: the runner can drive docker
        run: scripts/ci-require-docker.sh

      - name: rust, only if this runner has none
        run: |
          set -eu
          command -v cargo >/dev/null && exit 0
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: what this machine has to provide
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/ci-require-host-tools.sh

      - name: log in to ghcr.io
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # See ci.yml's identical step for why pre_id is captured through
      # `if id=$(...); then` rather than $(cmd 2>/dev/null || echo none)
      # inlined in the echo — the naive form broke on a real run because
      # `docker image inspect` writes a blank line to stdout before it
      # fails, corrupting the $GITHUB_OUTPUT line with an embedded newline.
      - name: pull the cached toolchain image, if there is one
        id: pull
        run: |
          set -eu
          if docker pull "$TOOLCHAIN_IMAGE"; then
              :
          else
              echo "release: no cached toolchain image yet (first run, or the pins moved)"
          fi
          pre_id=none
          if id=$(docker image inspect -f '{{.Id}}' "$TOOLCHAIN_IMAGE" 2>/dev/null); then
              pre_id="$id"
          fi
          echo "pre_id=$pre_id" >> "$GITHUB_OUTPUT"

      - name: the toolchain image is present and current
        id: build
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-toolchain-image.sh
          post_id=$(docker image inspect -f '{{.Id}}' "$TOOLCHAIN_IMAGE")
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"

      # Best-effort, same as ci.yml — a release is never cut from a fork,
      # so this is realistically always able to write, but it costs
      # nothing to fail soft here too rather than take the whole release
      # down over a cache push.
      - name: publish the toolchain image, if it rebuilt
        if: steps.pull.outputs.pre_id != steps.build.outputs.post_id
        continue-on-error: true
        run: docker push "$TOOLCHAIN_IMAGE"

      # --- the same gates ci.yml runs, and for the same reason: seconds,
      # so they run before the long build rather than after it ---------
      - name: history and hardware logs match their manifests
        run: ./scripts/check-history-intact.sh

      - name: the two build systems agree
        run: ./scripts/check-mesa-test-parity.sh

      - name: layer rules
        run: ./scripts/check-layering.sh

      - name: no absolute paths in tracked files
        run: ./scripts/check-no-abs-paths.sh

      - name: host tests
        run: ./scripts/run-host-tests.sh

      # Runs directly on the runner, same as ci.yml's identical step —
      # see its header for why: this script's own fetch steps need the
      # runner's python3/pip/curl/git, and horizon_run spawns its own
      # per-command `docker run` against $TOOLCHAIN_IMAGE for everything
      # that needs the cross toolchain. The full build, not `make all`:
      # every archive the tests link, including NVK, so the package below
      # can carry the fourteen t_vk_* tests. See this file's header.
      - name: every archive the tests link
        run: scripts/ci-build-archives.sh

      - name: package
        run: |
          set -eu
          scripts/package-horizon.sh build/pkg
          cat build/pkg/MANIFEST.txt

      # The digest has to be in there. If it is not, the packaging step
      # ran in a mode that cannot attribute these binaries to a
      # toolchain, and publishing them would put an unattributable
      # artefact in front of people.
      - name: the manifest identifies the toolchain
        run: |
          set -eu
          grep -qE '^image +: (in-image:|.*@sha256:)' build/pkg/MANIFEST.txt || {
              echo "error: MANIFEST.txt does not identify its toolchain:" >&2
              grep '^image' build/pkg/MANIFEST.txt >&2 || true
              echo "       Refusing to publish artefacts whose toolchain" >&2
              echo "       cannot be identified." >&2
              exit 1
          }

      - name: assemble the assets and the notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # On a tag this is the tag. On a workflow_dispatch it is the
          # BRANCH, and a branch name contains slashes. Only the
          # filename is sanitised; the publish step below is guarded on
          # the ref being a tag pushed as a tag (not just named like
          # one), so the name it passes is always the real one.
          safe_tag=$(printf '%s' "$tag" | tr '/' '-')
          tar -czf "mesa-nvk-horizon-${safe_tag}-nro.tar.gz" -C build/pkg .
          sha256sum "mesa-nvk-horizon-${safe_tag}-nro.tar.gz" \
              > "mesa-nvk-horizon-${safe_tag}-nro.tar.gz.sha256"

          build_id=$(sed -n 's/^build id  *: //p' build/pkg/MANIFEST.txt)
          count=$(find build/pkg -name '*.nro' | wc -l)
          vk_count=$(find build/pkg -name 't_vk_*.nro' | wc -l)
          nvk_lib_count=$(find build/pkg/lib/nvk -name '*.a' 2>/dev/null | wc -l)

          # The specific items this section names are the ones
          # docs/RELEASING.md's "What a release may claim" requires
          # stated in any release notes, not summarised — copied from
          # there rather than reworded, so the two cannot drift apart in
          # meaning even if the exact wording does. If STATUS.md's
          # Current state block has moved past one of these by the time
          # you are reading this, STATUS.md is the newer, correct source
          # and this list is what shipped with this specific build.
          {
            echo "## What is in this release"
            echo
            echo "\`lib/libhorizon_gpu.a\` and \`lib/libhorizon_compat.a\`, the"
            echo "\`include/horizon_gpu/\` public headers they are compiled"
            echo "against, the NVK driver's own archives under \`lib/nvk/\`, the"
            echo "full \`horizon_gpu\` test suite as standalone \`.nro\` homebrew"
            echo "— including the NVK/Vulkan driver tests, not just the"
            echo "driver-free subset — the licence they are distributed under,"
            echo "and a manifest tying every one of them to a single build and"
            echo "toolchain."
            echo
            echo "- **\`lib/libhorizon_gpu.a\` + \`lib/libhorizon_compat.a\` +"
            echo "  \`include/horizon_gpu/\`**"
            echo "- **\`lib/nvk/\`: ${nvk_lib_count} Mesa/NVK driver archive(s)**"
            echo "  — linked exactly as \`meson.build\`'s \`nvk_whole_libs\`/"
            echo "  \`nvk_test_libs\` and the \`t_vk_*\` tests already do; see"
            echo "  those for the link order (\`--start-group\`/\`--end-group\`"
            echo "  is load-bearing)."
            echo "- **${count} \`.nro\`, ${vk_count} of them \`t_vk_*\` (NVK/Vulkan)**"
            echo "- **Build id:** \`${build_id}\`"
            echo
            echo "Every test prints that build id as the second line of its"
            echo "log. If a log you are reporting does not carry this exact"
            echo "stamp, it came from other binaries. \`MANIFEST.txt\` carries"
            echo "the same stamp for the library, which cannot print its own."
            echo
            echo "Pre-1.0: the interfaces in \`include/horizon_gpu/\` may still"
            echo "change between releases. Check the build id against what you"
            echo "linked before assuming ABI compatibility across two of these."
            echo
            echo "## What this release does not claim"
            echo
            echo "**These artefacts are cross-built. No console has run"
            echo "them.** This project keeps *host build*, *cross build* and"
            echo "*verified on real hardware* strictly apart, and a release"
            echo "does not blur them: a \`.nro\` that compiles is not a"
            echo "\`.nro\` that works."
            echo
            echo "**What has never been verified, as of this build:**"
            echo
            echo "- Any display mode change, and docked resolution."
            echo "- Two surfaces over two \`NWindow\`s."
            echo "- \`VK_SUBOPTIMAL_KHR\` ever being *returned* — the rule"
            echo "  around it is measured over thousands of frames with zero"
            echo "  false positives, but the transition that would trigger"
            echo "  it has never executed on a console."
            echo
            echo "**Known failures**, from \`STATUS.md\`'s *Current state*"
            echo "block, not a summary of it — read that block for the full,"
            echo "current text and any that have been resolved since this"
            echo "build:"
            echo
            sed -n 's/^| \*\*Known failures\*\* | \(.*\) |$/\1/p' STATUS.md
            echo
            echo "This is pre-1.0 software driving a GPU through system"
            echo "services. It has taken a console down before. Run it when"
            echo "you are willing to reboot."
            echo
            echo "## Running these"
            echo
            echo "Copy the \`.nro\` to \`sdmc:/switch/horizon_gpu_tests/\` and"
            echo "launch from hbmenu. Each prints \`RESULT: PASS (n/n)\` on"
            echo "screen and to \`sdmc:/horizon_gpu_tests/<name>.log\`. Full"
            echo "instructions: \`docs/USAGE.md\`."
            echo
            echo "## Verifying what you downloaded"
            echo
            echo '```sh'
            echo "sha256sum -c mesa-nvk-horizon-${safe_tag}-nro.tar.gz.sha256"
            echo '```'
            echo
            echo "\`MANIFEST.txt\` inside the archive carries a sha256 for"
            echo "each \`.nro\`, the toolchain image it was built in, and the"
            echo "devkitA64 and libnx package versions the build used."
          } > NOTES.md

      # A manual run gets the artefact and stops. Everything above this
      # point is the useful half of a dry run — it builds, packages, and
      # proves the manifest identifies its toolchain — and none of it
      # should end in a published release.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          # A constant, not the ref: a branch name has slashes in it and
          # an artefact name is not a path.
          name: mesa-nvk-horizon-nro
          path: |
            mesa-nvk-horizon-*-nro.tar.gz
            mesa-nvk-horizon-*-nro.tar.gz.sha256
            NOTES.md
          if-no-files-found: error

      # ONLY FOR A PUSHED TAG, and the guard is not decoration.
      #
      # $GITHUB_REF_NAME is the *branch* name on a workflow_dispatch, so
      # startsWith(github.ref, 'refs/tags/v') alone is not enough: `gh
      # workflow run --ref v0.1.0` can target an EXISTING tag on a manual
      # dispatch too, which would satisfy that check while being a
      # dispatch, not a push — and then this step would edit the live
      # release and replace its assets with a fresh cross-build, quietly
      # overwriting whatever hardware verification that release recorded.
      # Requiring github.event_name == 'push' closes that: only an actual
      # tag push reaches this step.
      - name: publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          safe_tag=$(printf '%s' "$tag" | tr '/' '-')
          scripts/ci-github-release.sh "$tag" NOTES.md \
              "mesa-nvk-horizon-${safe_tag}-nro.tar.gz" \
              "mesa-nvk-horizon-${safe_tag}-nro.tar.gz.sha256"

      - name: say what a dispatch run did and did not do
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "Not a tag push, so nothing was published."
          echo "The package is attached to this run as an artefact."
          echo "To cut a release: git tag -a vX.Y.Z -m '…' && git push origin vX.Y.Z"
